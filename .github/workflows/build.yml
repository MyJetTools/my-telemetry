name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # No extra native deps needed on Windows:
      #  - my-tls gates `openssl` behind `cfg(unix)`, so openssl-sys is not pulled in.
      #  - aws-lc-sys (via tonic -> rustls -> aws-lc-rs) builds with the
      #    `prebuilt-nasm` feature already enabled, so NASM is not required.
      #  - CMake / MSVC / Perl are pre-installed on the windows-latest runner.

      - name: cargo build (workspace)
        run: cargo build --workspace --release

      - name: cargo test --no-run (workspace)
        run: cargo test --workspace --no-run
